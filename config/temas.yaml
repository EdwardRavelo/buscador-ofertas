# Un tema = una entrada. Agregar un tema nuevo NO requiere tocar codigo.
#
# Jerarquia de la pagina: ZONA > familia > tema.
#   zona     es una pestana. Separa dos cosas que se leen distinto: la agenda se
#            hojea ("que hay para hacer"), la oferta se consulta ("que descuento
#            hay hoy"). Mezcladas en una sola lista, la oferta bancaria de hoy
#            queda enterrada entre talleres de hace tres semanas.
#   familia  agrupa temas afines dentro de una zona.
#   tema     una entrada de `temas:`, un acordeon en la pagina.
#
# Campos:
#   zona                 nombre de la zona. Debe coincidir con una de `zonas:`.
#                        Si falta o no existe, el tema cae en la primera zona.
#   familia              agrupa temas afines en el dashboard. Sin esto la pagina
#                        mezcla un curso de IA con una obra de teatro en una sola
#                        lista indistinta.
#   ingesta: finde       solo busca de jueves a domingo. Una agenda del finde
#                        publicada un lunes habla del finde que YA PASO.
#   caduca: finde        lo que traiga vence el LUNES 00:00, no a los N dias de
#                        publicado. Es el tercer reloj del proyecto: por
#                        calendario, no rodante. Ver nucleo/calendario.py.
#   senales              terminos propios del tema que SUMAN puntaje (hasta +2.0)
#                        sin ser obligatorios. Para "me interesa todo el rubro,
#                        pero esto en particular va primero".
#   etiqueta / corto     como se muestra el tema en el sitio. Van en el YAML y no
#                        en el codigo: agregar un tema tiene que seguir siendo
#                        editar este archivo y nada mas.
#   keywords             consultas que se mandan a Google News
#   requerir             lista de GRUPOS. Dentro del grupo es O, entre grupos es Y.
#                        Ej: [zona] Y [actividad]. Un solo grupo no alcanza:
#                        con solo zona pasaba "agenda cultural"; con solo
#                        actividad pasaban cursos de Madrid.
#   excluir              si aparece alguno, se descarta
#   excluir_dominios     por SUFIJO de dominio. Ojo: ".co" como subcadena
#                        matchearia ".com" y borraria todo.
#   max_antiguedad_dias  descarta lo viejo (Google News mezcla 2018 con 2026)
#   vida_util_dias       cuantos dias se SIGUE MOSTRANDO en la pagina. Distinto de
#                        max_antiguedad_dias, que decide que ENTRA. Un festival
#                        de hace 21 dias ya paso; un curso online gratis de hace
#                        4 meses probablemente sigue abierto.
#   max_por_dominio      tope por medio, contra content farms
#   score_minimo         umbral 0-10 para entrar al informe

# Las zonas son las pestanas de arriba, en este orden.
#   acento  identidad visual de la zona. Solo hay dos definidas en la plantilla:
#           `teal` y `ambar`. Una zona nueva con otro acento SI requiere tocar el
#           CSS; es el unico pedazo de esto que no se resuelve en YAML.
zonas:
  - nombre: Este finde
    eyebrow: "Viernes a domingo en la Ciudad"
    acento: violeta
    tarjeta: agenda
    vacia: "Todavia no hay agenda del finde. Los medios la publican entre jueves y viernes; el lunes esto se vacia solo."

  - nombre: Cine
    eyebrow: "Ciclos y muestras en la Ciudad"
    acento: rosa
    tarjeta: agenda
    vacia: "Todavia no hay ciclos nuevos. Se revisa en cada corrida."

  - nombre: Agenda
    eyebrow: "Cultura y formacion"
    acento: teal
    tarjeta: agenda
    vacia: "Todavia nada en la agenda. Se revisa en cada corrida."

  - nombre: Ofertas
    eyebrow: "Descuentos y promociones"
    acento: ambar
    tarjeta: oferta
    vacia: "Todavia no hay promos vigentes. Duran pocos dias: se renueva a diario."

# Listas reutilizadas, para no repetirlas en cada tema.
_zona_caba: &zona_caba
  - "Buenos Aires"
  - "CABA"
  - "porteñ"
  - "Ciudad"
  - "Capital Federal"

_fuera_de_zona: &fuera_de_zona
  # "Buenos Aires" matchea la Ciudad Y la Provincia. Estas entradas separan una de otra.
  - "Provincia de Buenos Aires"
  - "Avellaneda"
  - "Lanús"
  - "UNLa"
  - "kilómetros de CABA"
  - "conurbano"
  - "Quilmes"
  - "San Isidro"
  - "Tigre"
  - "Paraná"
  - "Merlo"
  - "Mendoza"
  - "Córdoba"
  - "Salta"
  - "La Plata"
  - "Entre Ríos"
  - "Rosario"
  - "Tucumán"
  - "Colombia"
  - "México"
  - "Bogotá"
  - "Chile"
  - "España"
  - "Madrid"

temas:
  # --------------------------------------------------------------------- Cine
  - nombre: cine-caba
    zona: Cine
    familia: Ciclos y muestras
    etiqueta: "Ciclos de cine"
    corto: "Cine"
    tipo: [evento]
    gl: AR
    hl: es-419
    # Sondeado el 2026-09-12. Hay senal real de CABA: la retrospectiva de Frank
    # Borzage en la Sala Lugones, el Malba, OFFNI Cine Fest en la Casa del
    # Bicentenario, el festival de la UBA, el Museo del Cine. El ruido dominante
    # NO es tematico sino geografico: el FICPBA de La Plata aparecia en casi
    # todas las consultas, mas Cordoba, San Luis, Villa Gesell y Lujan.
    keywords:
      - "ciclo de cine Buenos Aires"
      - "ciclo de cine gratuito CABA funciones"
      - "Sala Lugones ciclo retrospectiva"
      - "MALBA cine ciclo funciones Buenos Aires"
      - "cine club Buenos Aires ciclo proyecciones"
      - "muestra de cine Buenos Aires entrada gratuita"
    requerir:
      # Salas y espacios porteños que no siempre nombran la ciudad.
      - [*zona_caba, "Sala Lugones", "Malba", "Museo del Cine", "Gaumont",
         "Casa del Bicentenario", "Cine Cosmos", "Lorca", "Belgrano Multiplex",
         "Cineclub", "Cine Club"]
      # Que sea CICLO y no la cartelera comercial de la semana. Es el pedido:
      # "todos los ciclos", no todos los estrenos.
      - ["ciclo", "ciclos", "retrospectiva", "retrospectivas", "muestra",
         "muestras", "festival", "cineclub", "cine club", "programacion",
         "proyeccion", "proyecciones", "funciones", "temporada"]
      # Y que sea de cine.
      - ["cine", "pelicula", "peliculas", "film", "films", "filmoteca",
         "cortometraje", "cortometrajes", "largometraje", "documental"]
    excluir:
      - *fuera_de_zona
      # El festival de la PROVINCIA copaba el sondeo.
      - "FICPBA"
      - "FICBA"
      - "bonaerense"
      - "San Luis"
      - "Villa Gesell"
      - "Lujan"
      - "Mar del Plata"
      - "Museo MAR"
      # Cartelera comercial y taquilla: no son ciclos.
      - "taquilla"
      - "estreno mundial"
      - "box office"
      - "Netflix"
      - "streaming"
      - "plataforma"
      # Politica audiovisual, no un ciclo.
      - "ley audiovisual"
      - "fomento al cine"
    excluir_dominios: [".es", ".mx", ".cl", ".co", ".pe", ".uy", ".py"]
    max_antiguedad_dias: 30
    # Un ciclo dura semanas: vive mas que un festival suelto.
    vida_util_dias: 45
    # Mas alto que el 2 habitual: el tope existe contra content farms, pero aca
    # los medios que mas publican son especializados en cine (escribiendocine,
    # otroscines). Con 2 se perdia la retrospectiva de Frank Borzage en la Sala
    # Lugones, que era el mejor item del sondeo.
    max_por_dominio: 4
    score_minimo: 6.5
    # Las agendas de cine tambien se sindican entre medios chicos.
    unico_por_titulo: true

  # --------------------------------------------------------------- Este finde
  - nombre: finde-caba
    zona: Este finde
    familia: Agenda del finde
    etiqueta: "Musica, teatro y arte"
    corto: "Finde"
    tipo: [evento]
    gl: AR
    hl: es-419
    # Sondeado el 2026-09-12 (sabado): los medios publican la agenda del finde
    # entre jueves y viernes. Clarin, iProfesional, Pagina 12, argentina.gob.ar y
    # bairessecreta tenian nota fresca. El ruido es provincial, no tematico.
    keywords:
      - "que hacer este fin de semana Buenos Aires"
      - "agenda cultural fin de semana Buenos Aires"
      - "planes fin de semana CABA recitales teatro"
      - "shows y recitales este fin de semana Buenos Aires"
      - "agenda porteña fin de semana muestras arte"
    requerir:
      - *zona_caba
      # Que sea del fin de semana y no de cualquier dia.
      - ["fin de semana", "finde", "sabado", "domingo", "viernes", "este finde"]
      # Y que sea una expresion artistica, no cualquier plan.
      - ["cultural", "cultura", "agenda", "planes", "musica", "recital",
         "recitales", "show", "shows", "concierto", "teatro", "obra", "arte",
         "muestra", "muestras", "exposicion", "festival", "feria", "danza",
         "cine", "milonga", "tango", "peña"]
    excluir:
      - *fuera_de_zona
      # Localidades que aparecieron en el sondeo con agenda propia.
      - "Rauch"
      - "Haedo"
      - "Castelar"
      - "zona norte"
      - "bonaerense"
      - "bonaerenses"
      - "Escapada"
      - "escapadas"
      # "en la Provincia" sin nombrar el partido: el anchor _fuera_de_zona pide
      # "Provincia de Buenos Aires" completo y esto se le escapaba.
      - "en la Provincia"
      - "la Provincia"
      # No son expresiones artisticas aunque la nota diga "fin de semana".
      - "cortes y desvios"
      - "autopista"
      - "brunch"
      - "pronostico"
      - "clima"
    excluir_dominios: [".py", ".uy", ".mx", ".cl", ".co", ".pe", ".es"]
    # Solo lo muy fresco: una agenda de hace una semana es la del finde pasado.
    max_antiguedad_dias: 4
    # Sin vida_util_dias: `caduca: finde` pone la fecha exacta y esa manda.
    ingesta: finde
    caduca: finde
    # Las agendas del finde se sindican palabra por palabra entre medios.
    unico_por_titulo: true
    max_por_dominio: 2
    score_minimo: 6.5

  # ---------------------------------------------------------------- Cultura
  - nombre: talleres-lectura-caba
    zona: Agenda
    familia: Cultura porteña
    etiqueta: "Talleres y lectura"
    corto: "Talleres"
    tipo: [taller]
    gl: AR
    hl: es-419
    keywords:
      - "talleres gratuitos bibliotecas Buenos Aires inscripción"
      - "taller de lectura biblioteca porteña inscripción"
      - "taller escritura literatura CABA gratuito"
      - "Red de Bibliotecas de la Ciudad talleres"
    requerir:
      # Se suma a la zona compartida: la Biblioteca Nacional y la del Congreso
      # estan en CABA pero sus anuncios no siempre nombran la ciudad.
      - [*zona_caba, "Biblioteca Nacional", "Biblioteca del Congreso"]
      - ["taller", "talleres", "inscripción", "inscripciones", "cupos", "curso"]
      # Tercer grupo: el tema es talleres de LECTURA, pero el filtro nunca pedia
      # nada sobre leer. Sin esto pasaba el "Congreso de Ciudades Inteligentes".
      - ["lectura", "escritura", "literatura", "literario", "biblioteca",
         "bibliotecas", "libro", "libros", "escritor", "poesía", "narrativa",
         "cuento", "lectores", "bibliotecario"]
    excluir:
      - *fuera_de_zona
      # "taller" en espanol tambien es galpon de reparaciones y atelier.
      - "taller mecánico"
      - "talleres del subte"
      - "taller de reparación"
      - "talleres ferroviarios"
      - "metrodelegados"
      - "recorridos guiados"
    max_antiguedad_dias: 45
    # Ventana tipica de inscripcion a un taller.
    vida_util_dias: 35
    max_por_dominio: 2
    score_minimo: 6

  - nombre: festivales-caba
    zona: Agenda
    familia: Cultura porteña
    etiqueta: "Festivales"
    corto: "Festivales"
    tipo: [festival]
    gl: AR
    hl: es-419
    keywords:
      - "festival Buenos Aires entrada gratuita"
      - "festival gratuito CABA programación"
      - "festival de cine Buenos Aires entrada libre"
      - "festival de música Buenos Aires gratis"
      - "festival porteño programación completa"
    requerir:
      - *zona_caba
      - ["festival", "festivales", "ciclo"]
    excluir: *fuera_de_zona
    # Un festival que ya pasó no sirve: ventana corta a proposito.
    max_antiguedad_dias: 21
    # El festival ya paso: mostrarlo despues hace perder tiempo. Mas corta que la
    # ventana de ingesta a proposito: entra el anuncio previo, pero a los 10 dias
    # de publicado lo mas probable es que el festival ya haya sucedido.
    vida_util_dias: 10
    max_por_dominio: 2
    score_minimo: 7.5

  - nombre: teatro-gratis-caba
    zona: Agenda
    familia: Cultura porteña
    etiqueta: "Teatro gratis"
    corto: "Teatro"
    tipo: [teatro]
    gl: AR
    hl: es-419
    keywords:
      - "teatro gratis Buenos Aires función"
      - "obra de teatro entrada libre CABA"
      - "teatro gratuito porteño cartelera"
      - "función gratuita teatro Buenos Aires"
      - "Complejo Teatral Buenos Aires entrada gratuita"
      - "Teatro Colón concierto gratuito"
      - "FIBA Festival Internacional Buenos Aires obras"
      - "teatro a la gorra Buenos Aires"
    requerir:
      - *zona_caba
      - ["teatro", "obra", "función", "funciones", "escena", "dramaturgia"]
      # Tercer grupo: que sea realmente gratis. Sin esto entra toda la cartelera
      # comercial de Corrientes.
      - ["gratis", "gratuito", "gratuita", "entrada libre", "sin cargo", "a la gorra", "gratuitas", "gratuitos", "libre y gratuita", "sin costo"]
    excluir: *fuera_de_zona
    max_antiguedad_dias: 35
    # Las funciones se agotan o termina la temporada.
    vida_util_dias: 30
    max_por_dominio: 2
    score_minimo: 6

  # -------------------------------------------------------------- Formación
  - nombre: cursos-ia
    zona: Agenda
    familia: Formación
    etiqueta: "Inteligencia artificial"
    corto: "IA"
    tipo: [curso]
    gl: AR
    hl: es-419
    keywords:
      - "curso gratis inteligencia artificial certificado"
      - "certificación gratuita IA generativa"
      - "curso gratuito IA inscripción abierta"
    requerir:
      - ["curso", "cursos", "certificación", "capacitación", "formación"]
      - ["inteligencia artificial", "IA", "ChatGPT", "Claude", "Gemini", "machine learning"]
    excluir:
      - "masterclass de ventas"
      - "webinar promocional"
      - "curso de Excel"
      - "Madrid"
      - "Galapagar"
      - "Morelia"
      - "Bogotá"
      - "Segovia"
      - "Colombia"
      - "Chile"
      - "Comunidad de Madrid"
      # mimorelia.com es .com, asi que el filtro de TLD no lo agarra.
      - "UMSNH"
      - "Michoacán"
      - "salvadoreño"
    excluir_dominios: [".cl", ".mx", ".py", ".pe", ".ve", ".bo", ".ec", ".sv"]
    max_antiguedad_dias: 30
    # Los cursos online gratis no cierran: Google, IBM y Platzi los dejan abiertos.
    vida_util_dias: 150
    max_por_dominio: 2
    score_minimo: 6

  - nombre: ingles
    zona: Agenda
    familia: Formación
    etiqueta: "Inglés"
    corto: "Inglés"
    tipo: [curso, descuento]
    gl: AR
    hl: es-419
    keywords:
      - "curso de inglés gratis certificado Argentina"
      - "curso inglés gratuito inscripción Buenos Aires"
      - "curso de inglés descuento promoción"
    requerir:
      - ["inglés", "idiomas", "bilingüe"]
      - ["curso", "cursos", "taller", "inscripción", "beca", "capacitación"]
    excluir:
      # "El Corte Inglés" es una tienda espanola: matcheaba "inglés" y colaba
      # ofertas de notebooks.
      - "Corte Inglés"
      - "alemán"
      - "portugués"
      - "francés"
      - "italiano"
      - "Bogotá"
      - "Segovia"
      - "Paraguay"
      - "Madrid"
      # Instituciones extranjeras que el filtro de dominio no agarra: publican
      # desde un .com y el titulo no nombra la ciudad.
      - "Escuelas Oficiales de Idiomas"
      - "salvadoreño"
      - "El Salvador"
      - "UMSNH"
      - "Michoacán"
    excluir_dominios: [".py", ".co", ".mx", ".cl", ".pe", ".sv", ".ve", ".bo", ".ec"]
    max_antiguedad_dias: 60
    # Mezcla: la inscripcion oficial vence, los cursos online no.
    vida_util_dias: 90
    max_por_dominio: 2
    score_minimo: 6

  # ---------------------------------------------------------------- Ofertas
  - nombre: bbva
    zona: Ofertas
    familia: Bancos y tarjetas
    etiqueta: "BBVA / Banco Frances"
    corto: "BBVA"
    tipo: [descuento]
    # Sin `keywords`: esta fuente no busca, lee el catalogo entero del banco.
    # `fuentes` limita el tema a la API de BBVA. Sin esta linea correrian TODAS
    # las fuentes registradas y entrarian notas de prensa por la ventana.
    fuentes: [bbva]
    # Solo la primera pagina: las 20 que el banco destaca hoy. El catalogo entero
    # son 926 promos y volcarlas en un acordeon no es una pagina, es un volcadero.
    # Los temas de compra puntual SI leen todo, porque filtran por comercio.
    bbva_paginas: 1
    # Sin `requerir`: la fuente ya es el banco. Pedir "BBVA" en el titulo tiraria
    # "Rapanui 20%", que es una promo de BBVA aunque no lo nombre.
    senales:
      # Lo que el usuario mas busca dentro del rubro.
      - "cuotas sin interes"
      - "cuotas"
      - "2x1"
    # No se declaran ventanas de tiempo A PROPOSITO. La fuente trae `fechaHasta`
    # real, y cuando hay vigencia declarada el puntuador ignora la antiguedad y
    # el dashboard ignora vida_util_dias. Poner numeros aca solo confundiria.
    max_por_dominio: 99
    score_minimo: 5

  # --- Compras puntuales: se agregan y se borran segun lo que haga falta -------
  - nombre: pelota-futbol
    zona: Ofertas
    familia: Lo que estoy buscando
    etiqueta: "Pelota de futbol"
    corto: "Pelota"
    tipo: [descuento]
    fuentes: [bbva]
    # OJO con que es esto: NO busca el precio de una pelota. Busca promos del
    # banco EN COMERCIOS donde se compra una. El banco publica "Nike 6 cuotas",
    # no "pelota 20% off", asi que el filtro va por comercio y rubro.
    # Para el precio del producto existe /buscar-oferta, que lee MercadoLibre
    # desde el Chrome del usuario (al servidor le devuelve 403).
    # Lee el catalogo COMPLETO (47 paginas): las 22 promos de comercios deportivos
    # estan todas fuera de la primera. Con `bbva_paginas: 1` aparecia solo Nike.
    requerir:
      # Donde se compra una pelota. Verificado contra las 926 promos vigentes.
      - ["Nike", "Adidas", "Puma", "Dexter", "Stock Center", "Open Sports",
         "Moov", "Topper", "Umbro", "Reebok", "New Balance", "Under Armour",
         "Asics", "Sport", "Sports", "Deporte", "Deportes", "Deportivo",
         "Futbol", "Pelota", "Run &", "Running", "Bike",
         # Va pegado en "A'S Mundodeporte" y el puntuador ancla el inicio de
         # palabra, asi que "Deporte" solo no lo agarra.
         "Mundodeporte"]
      # Y que efectivamente tenga cuotas o descuento, que es lo que se pidio.
      - ["cuotas", "cuotas sin interes", "descuento", "descuentos", "reintegro",
         "off", "2x1", "ahorro"]
    senales:
      - "cuotas sin interes"
    # Un catalogo no tiene notas repetidas: cada comercio es una promo distinta
    # aunque el titulo sea calcado. Sin esto se perdian Top Sport, Sport 78 y
    # Under Armour por parecerse entre si.
    agrupar_casi_repetidas: false
    # Sin ventanas de tiempo: la fuente declara `fechaHasta` y esa manda.
    max_por_dominio: 99
    score_minimo: 5
